name: Release Build

on:
  push:
    tags:
      - 'v*' # Trigger workflow saat ada push tag yang berawalan 'v' (misal: v0.2.6)

jobs:
  build-and-release:
    name: Build on ${{ matrix.os }}
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Windows Build (Native)
          - os: windows-latest
            goos: windows
            goarch: amd64
            output: pomodoro-windows-amd64.exe
          
          # Linux Build (Native)
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            output: pomodoro-linux-amd64
          
          # macOS Intel Build (Native)
          - os: macos-latest
            goos: darwin
            goarch: amd64
            output: pomodoro-darwin-amd64
            
          # macOS Apple Silicon M1/M2 Build (Native)
          - os: macos-14
            goos: darwin
            goarch: arm64
            output: pomodoro-darwin-arm64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: true

      # Robotgo (library screenshot & mouse) butuh dependency C++ khusus di Linux
      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libx11-dev libxext-dev libxrender-dev libxrandr-dev libxtst-dev libxfixes-dev libxkbcommon-dev xsel xclip

      - name: Build Binary (Inject Private Key)
        env:
          CGO_ENABLED: 1
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -ldflags="-s -w -X 'main.PrivateKey=${{ secrets.PRIVATE_KEY }}'" -o ${{ matrix.output }} .
          
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.output }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
